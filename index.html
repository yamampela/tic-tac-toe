<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f2e1e;
    --cell-bg: #234a34;
    --cell-hover: #2d5c40;
    --line: #163625;
    --text: #f2f7ec;
    --accent-x: #ffb703;
    --accent-o: #ff5d73;
    --win: #ffe066;
    --panel-bg: rgba(11, 43, 28, 0.62);
    --panel-border: rgba(255, 224, 102, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(255, 224, 102, 0.28), transparent 32%),
      radial-gradient(circle at 85% 20%, rgba(45, 212, 167, 0.22), transparent 38%),
      radial-gradient(circle at 75% 85%, rgba(255, 141, 61, 0.16), transparent 40%),
      linear-gradient(160deg, #041a10 0%, #0b3d26 30%, #146339 55%, #1f8a4d 78%, #3fb673 100%);
    background-attachment: fixed;
  }
  .foliage {
    position: fixed;
    font-size: 5rem;
    opacity: 0.35;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }
  .foliage.tl { top: -1.5rem; left: -1rem; transform: rotate(-15deg); }
  .foliage.tr { top: -2rem; right: -1.5rem; transform: rotate(20deg) scaleX(-1); font-size: 6rem; }
  .foliage.bl { bottom: -2rem; left: -1.5rem; transform: rotate(10deg); font-size: 6.5rem; }
  .foliage.br { bottom: -1.5rem; right: -1rem; transform: rotate(-25deg) scaleX(-1); }
  .foliage.mid { top: 40%; left: 4%; font-size: 3rem; opacity: 0.22; transform: rotate(8deg); }
  #panel {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 2rem 2.25rem;
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
  }
  h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.05em; }
  #status {
    font-size: 1.2rem;
    min-height: 1.6rem;
    font-weight: 600;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 6px;
    background: var(--line);
    padding: 6px;
    border-radius: 12px;
  }
  .cell {
    background: var(--cell-bg);
    border: none;
    border-radius: 8px;
    font-size: 2.75rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s ease;
  }
  .cell:hover:not(:disabled) {
    background: var(--cell-hover);
  }
  .cell:disabled {
    cursor: default;
  }
  .cell.x { color: var(--accent-x); }
  .cell.o { color: var(--accent-o); }
  .cell.win { color: var(--win); }
  #reset {
    padding: 0.6rem 1.4rem;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: var(--accent-x);
    color: #10101a;
    cursor: pointer;
  }
  #reset:hover { opacity: 0.9; }
  #controls {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  #controls label {
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  #controls label[hidden] {
    display: none;
  }
  #controls select {
    font-size: 0.95rem;
    padding: 0.3rem 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--cell-bg);
    color: var(--text);
  }
</style>
</head>
<body>
  <span class="foliage tl" aria-hidden="true">🌿</span>
  <span class="foliage tr" aria-hidden="true">🌴</span>
  <span class="foliage bl" aria-hidden="true">🍃</span>
  <span class="foliage br" aria-hidden="true">🌴</span>
  <span class="foliage mid" aria-hidden="true">🦜</span>

  <div id="panel">
    <h1>Tic-Tac-Toe</h1>
    <div id="controls">
      <label>Mode:
        <select id="mode">
          <option value="pvp">2 Players</option>
          <option value="cpu">Vs Computer</option>
        </select>
      </label>
      <label id="difficultyLabel" hidden>Difficulty:
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
    </div>
    <div id="status">Player X's turn</div>
    <div id="board"></div>
    <button id="reset">Restart</button>
  </div>

<script>
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset');
  const modeEl = document.getElementById('mode');
  const difficultyEl = document.getElementById('difficulty');
  const difficultyLabel = document.getElementById('difficultyLabel');

  const WIN_LINES = [
    [0,1,2], [3,4,5], [6,7,8],
    [0,3,6], [1,4,7], [2,5,8],
    [0,4,8], [2,4,6],
  ];

  const HUMAN = 'X';
  const CPU = 'O';

  let board = Array(9).fill(null);
  let currentPlayer = 'X';
  let gameOver = false;

  function isCpuMode() {
    return modeEl.value === 'cpu';
  }

  function isCpuTurn() {
    return isCpuMode() && currentPlayer === CPU && !gameOver;
  }

  function render() {
    boardEl.innerHTML = '';
    board.forEach((value, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell' + (value ? ' ' + value.toLowerCase() : '');
      btn.textContent = value || '';
      btn.disabled = Boolean(value) || gameOver || isCpuTurn();
      btn.setAttribute('aria-label', `Cell ${i + 1}`);
      btn.addEventListener('click', () => handleMove(i));
      boardEl.appendChild(btn);
    });
  }

  function handleMove(index) {
    if (board[index] || gameOver || isCpuTurn()) return;
    board[index] = currentPlayer;

    if (checkEnd()) return;

    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    statusEl.textContent = `Player ${currentPlayer}'s turn`;
    render();

    if (isCpuTurn()) {
      setTimeout(cpuMove, 350);
    }
  }

  function checkEnd() {
    const winLine = getWinningLine();
    if (winLine) {
      gameOver = true;
      const label = isCpuMode() && currentPlayer === CPU ? 'Computer' : `Player ${currentPlayer}`;
      statusEl.textContent = `${label} wins!`;
      render();
      highlightWin(winLine);
      return true;
    }

    if (board.every(cell => cell)) {
      gameOver = true;
      statusEl.textContent = "It's a tie!";
      render();
      return true;
    }

    return false;
  }

  function getWinningLine(b = board) {
    return WIN_LINES.find(([a, b1, c]) =>
      b[a] && b[a] === b[b1] && b[a] === b[c]
    );
  }

  function highlightWin(line) {
    const cells = boardEl.querySelectorAll('.cell');
    line.forEach(i => cells[i].classList.add('win'));
  }

  function cpuMove() {
    if (gameOver) return;
    const index = pickCpuMove(difficultyEl.value);
    board[index] = CPU;

    if (checkEnd()) return;

    currentPlayer = HUMAN;
    statusEl.textContent = "Player X's turn";
    render();
  }

  function availableMoves(b) {
    return b.reduce((acc, cell, i) => { if (!cell) acc.push(i); return acc; }, []);
  }

  function pickCpuMove(difficulty) {
    const moves = availableMoves(board);
    if (difficulty === 'easy') {
      return moves[Math.floor(Math.random() * moves.length)];
    }
    if (difficulty === 'medium') {
      // Take a winning move or block one 70% of the time, otherwise play randomly.
      if (Math.random() < 0.7) {
        const winning = findImmediateMove(board, CPU) ?? findImmediateMove(board, HUMAN);
        if (winning !== null) return winning;
      }
      return moves[Math.floor(Math.random() * moves.length)];
    }
    return findBestMove(board);
  }

  function findImmediateMove(b, player) {
    for (const move of availableMoves(b)) {
      const copy = b.slice();
      copy[move] = player;
      if (getWinningLine(copy)) return move;
    }
    return null;
  }

  function findBestMove(b) {
    let bestScore = -Infinity;
    let bestMove = null;
    for (const move of availableMoves(b)) {
      const copy = b.slice();
      copy[move] = CPU;
      const score = minimax(copy, 0, false);
      if (score > bestScore) {
        bestScore = score;
        bestMove = move;
      }
    }
    return bestMove;
  }

  function minimax(b, depth, isMaximizing) {
    const winLine = getWinningLine(b);
    if (winLine) {
      const winner = b[winLine[0]];
      return winner === CPU ? 10 - depth : depth - 10;
    }
    if (b.every(cell => cell)) return 0;

    if (isMaximizing) {
      let best = -Infinity;
      for (const move of availableMoves(b)) {
        const copy = b.slice();
        copy[move] = CPU;
        best = Math.max(best, minimax(copy, depth + 1, false));
      }
      return best;
    } else {
      let best = Infinity;
      for (const move of availableMoves(b)) {
        const copy = b.slice();
        copy[move] = HUMAN;
        best = Math.min(best, minimax(copy, depth + 1, true));
      }
      return best;
    }
  }

  function reset() {
    board = Array(9).fill(null);
    currentPlayer = 'X';
    gameOver = false;
    statusEl.textContent = "Player X's turn";
    render();
  }

  resetBtn.addEventListener('click', reset);
  modeEl.addEventListener('change', () => {
    difficultyLabel.hidden = !isCpuMode();
    reset();
  });
  difficultyEl.addEventListener('change', reset);

  render();
</script>
</body>
</html>
